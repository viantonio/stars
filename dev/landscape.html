<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Landscape harness</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; font: 12px system-ui, sans-serif; color: #ccd; }
  canvas { display: block; }
  #ui { position: fixed; left: 8px; top: 8px; background: rgba(0,0,0,.55); padding: 8px 10px; border-radius: 6px; line-height: 1.8; }
  #ui label { display: block; }
  #ui input[type=range] { width: 180px; vertical-align: middle; }
  body.shot #ui { display: none; }
</style>
</head>
<body>
<div id="ui">
  <div><b>Keys</b>: 1 foothills · 2 city · 3 alpine · 4 flat · N night-vision · M moon · ←/→ look · P pano</div>
  <label>Sun alt <input id="sunAlt" type="range" min="-40" max="70" step="0.5" value="20" /> <span id="sunAltV"></span></label>
  <label>Sun az <input id="sunAz" type="range" min="0" max="360" step="1" value="240" /> <span id="sunAzV"></span></label>
  <label>View az <input id="viewAz" type="range" min="0" max="360" step="1" value="60" /> <span id="viewAzV"></span></label>
  <label>Light pollution <input id="lp" type="range" min="0" max="1" step="0.01" value="0.15" /> <span id="lpV"></span></label>
  <div id="info"></div>
</div>
<script type="module" src="./landscape.ts"></script>
</body>
</html>
